<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f5f7"/>
      <stop offset="100%" stop-color="#e8e8ed"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f5f7"/>
      <stop offset="45%" stop-color="#b8b8c0"/>
      <stop offset="100%" stop-color="#8e8e96"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#0b2b5c"/>
      <stop offset="45%" stop-color="#123a7a"/>
      <stop offset="100%" stop-color="#04101f"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#6e6e73"/>
      <stop offset="45%" stop-color="#1d1d1f"/>
      <stop offset="100%" stop-color="#86868b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="160" r="200" fill="#0071e3" opacity="0.08"/>
  <circle cx="150" cy="520" r="240" fill="#7c8ca0" opacity="0.1"/>

  <!-- Phone illustration -->
  <g transform="translate(760,75) scale(1.4)">
    <rect x="14" y="8" width="172" height="404" rx="38" fill="url(#frame)"/>
    <rect x="19" y="13" width="162" height="394" rx="34" fill="#0a0a0a"/>
    <rect x="24" y="24" width="152" height="372" rx="28" fill="url(#screen)"/>
    <rect x="66" y="34" width="68" height="22" rx="11" fill="#000"/>
    <circle cx="148" cy="120" r="34" fill="none" stroke="#2f7be0" stroke-width="3" opacity="0.7"/>
    <circle cx="148" cy="120" r="22" fill="none" stroke="#5aa2f2" stroke-width="3" opacity="0.6"/>
    <circle cx="148" cy="120" r="10" fill="#7fc0ff" opacity="0.8"/>
  </g>

  <!-- Text -->
  <text x="90" y="210" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="bold" fill="#1d1d1f">Apple Store Premium</text>
  <text x="92" y="285" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#6e6e73">O próximo smartphone já está esperando por você.</text>
  <rect x="92" y="330" width="320" height="64" rx="32" fill="#0071e3"/>
  <text x="252" y="371" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#ffffff" text-anchor="middle">Ver Produtos</text>
</svg>
